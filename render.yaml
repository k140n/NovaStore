# NovaStore Production Blueprint - Mobile-Optimized Carousel v1.1
services:
  - type: web
    name: novastore
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --noinput && python manage.py seed_data && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: novastore-db
          property: connectionString

databases:
  - name: novastore-db
    region: oregon
    plan: free
    databaseName: novastore
    user: novastore_user
